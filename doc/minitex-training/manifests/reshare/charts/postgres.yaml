apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: resharedb
  namespace: minitex-training
spec:
  chart:
    spec:
      chart: postgresql
      # this is the chart version, not postgres
      version: 13.2.19
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  interval: 30m

  values:
    image:
      repository: bitnamilegacy/postgresql
      tag: 16.1.0-debian-11-r11
  
    auth:
      enablePostgresUser: true
      postgresPassword: "pgadmin123"
  
    primary:
      initdb:
        scripts:
          init.sql: |
            CREATE ROLE okapi WITH PASSWORD 'okapi123' LOGIN CREATEDB;
            CREATE DATABASE okapi WITH OWNER okapi;
  
            CREATE ROLE reshare WITH PASSWORD 'reshare123' LOGIN SUPERUSER;
            CREATE DATABASE reshare WITH OWNER reshare;
  
      persistence:
        size: 40Gi
        storageClass: gp3
  
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1024Mi
