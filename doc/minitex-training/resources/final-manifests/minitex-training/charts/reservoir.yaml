apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: reservoir
  namespace: minitex-training
spec:
  interval: 5m
  timeout: 10m
  releaseName: reservoir
  chart:
    spec:
      chart: reservoir
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: idgithub-public
        namespace: flux-system
      version: "0.1.0-master.243+sha.b6319e9"
  values:
    probes:
      enabled: true
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - reservoir
            topologyKey: "kubernetes.io/hostname"
    podAnnotations:
      checksum/config: "3"
    envSecretRefs:
      - reshare-db-connect
    service:
      type: ClusterIP
    metrics:
      monitor:
        enabled: true
